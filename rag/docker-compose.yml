services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mimic-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ../qdrant_storage:/qdrant/storage

  rag-indexer:
    build:
      context: ..
      dockerfile: rag/Dockerfile
    container_name: mimic-rag-indexer
    environment:
      PGHOST: host.docker.internal
      PGPORT: "5432"
      PGDATABASE: mimic
      PGUSER: postgres
      PGPASSWORD: postgres
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: mimic3_notes
      NOTE_LIMIT: "0"
    depends_on:
      - qdrant
    volumes:
      - ../artifacts:/app/artifacts

